<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="x-build" content="layout-fix-3">
<meta name="theme-color" content="#f5f5f7">
<title>阅读器</title>
<style>
  :root {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --text: #1d1d1f;
    --text-soft: #6e6e73;
    --line: rgba(0,0,0,0.08);
    --accent: #0071e3;
    --shadow: 0 8px 30px rgba(0,0,0,0.12);
    --maxw: 42rem;
    --font-size: 19px;
    --line-height: 1.9;
    --font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
  }
  [data-theme="sepia"] {
    --bg: #f4ecd8; --panel: #fbf3e0; --text: #4a3f2f; --text-soft: #8a7a5c;
    --line: rgba(74,63,47,0.12); --accent: #9a6a2f; --shadow: 0 8px 30px rgba(74,63,47,0.18);
  }
  [data-theme="dark"] {
    --bg: #000000; --panel: #1c1c1e; --text: #ebebf0; --text-soft: #98989f;
    --line: rgba(255,255,255,0.12); --accent: #2997ff; --shadow: 0 8px 30px rgba(0,0,0,0.6);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    transition: background .3s ease, color .3s ease;
    overflow: hidden;
  }
  /* ---------- 顶栏 ---------- */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    height: 52px; padding: env(safe-area-inset-top) 14px 0;
    display: flex; align-items: center; gap: 8px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
    transition: transform .3s ease, opacity .3s ease;
  }
  header.hidden { transform: translateY(-100%); opacity: 0; visibility: hidden; pointer-events: none; }
  .icon-btn {
    width: auto; min-width: 38px; height: 38px; padding: 0 12px;
    border: none; border-radius: 18px;
    background: transparent; color: var(--text); font-size: 15px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    cursor: pointer; flex: 0 0 auto;
    transition: background .2s, transform .1s;
  }
  .icon-btn:active { background: var(--line); transform: scale(.96); }
  .title-btn {
    flex: 1; min-width: 0; padding: 0 8px; height: 38px; border: none; border-radius: 18px;
    background: transparent; color: var(--text); font: inherit;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    cursor: pointer; transition: background .2s; overflow: hidden;
  }
  .title-btn:hover, .title-btn:active { background: var(--line); }
  .title-btn .title-arrow { font-size: 16px; opacity: .55; flex: 0 0 auto; }
  .title-btn #bookTitle { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
  .book-title {
    font-size: 15px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
  }
  /* ---------- 阅读区 ---------- */
  #reader {
    position: fixed; inset: 0;   /* fixed 相对可视视口，移动端可正常滚动；absolute 在手机上会被锁高 */
    height: 100vh; height: 100dvh;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
    scroll-behavior: smooth;
  }
  #content {
    max-width: var(--maxw); margin: 0 auto;
    padding: calc(52px + env(safe-area-inset-top) + 28px) 22px calc(120px + env(safe-area-inset-bottom));
  }
  .chapter-title {
    font-size: 1.25em; font-weight: 700; line-height: 1.4;
    margin: 0 0 1.1em; letter-spacing: .01em;
  }
  #content p {
    font-family: var(--font-family);
    font-size: var(--font-size); line-height: var(--line-height);
    margin: 0 0 1.05em; text-align: justify; text-indent: 2em;
    word-break: break-word;
  }
  #content p.no-indent { text-indent: 0; }
  /* ---------- 底栏进度 ---------- */
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 0 0 env(safe-area-inset-bottom);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--line);
    transition: transform .3s ease, opacity .3s ease;
  }
  footer.hidden { transform: translateY(100%); opacity: 0; visibility: hidden; pointer-events: none; }
  .progress-track { height: 3px; background: var(--line); }
  .progress-bar { height: 100%; width: 0; background: var(--accent); transition: width .15s linear; }
  .footer-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; font-size: 13px; color: var(--text-soft); }
  .footer-bar .nav-btn { background: none; border: none; color: var(--accent); font-size: 15px; cursor: pointer; padding: 6px 10px; border-radius: 8px; }
  .footer-bar .nav-btn:disabled { color: var(--text-soft); opacity: .4; cursor: default; }
  .footer-bar .nav-btn:active:not(:disabled) { background: var(--line); }
  .chapter-pos { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; }
  /* ---------- 抽屉（目录/设置） ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; bottom: 0; z-index: 50; width: min(86vw, 340px);
    background: var(--panel); box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    transition: transform .32s cubic-bezier(.4,0,.2,1);
  }
  .drawer.left { left: 0; transform: translateX(-100%); }
  .drawer.right { right: 0; transform: translateX(100%); }
  .drawer.show { transform: translateX(0); }
  .drawer-head { padding: calc(env(safe-area-inset-top) + 16px) 18px 12px; font-size: 17px; font-weight: 700; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
  .drawer-search { margin: 12px 18px 6px; }
  .drawer-search input {
    width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 14px; outline: none;
  }
  .drawer-body { flex: 1; overflow-y: auto; padding: 6px 8px 20px; -webkit-overflow-scrolling: touch; }
  .toc-item {
    display: block; width: 100%; text-align: left; border: none; background: none;
    color: var(--text); padding: 11px 12px; border-radius: 10px; font-size: 14.5px;
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background .15s;
  }
  .toc-item:active { background: var(--line); }
  .toc-item.active { color: var(--accent); font-weight: 600; background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .toc-empty { padding: 30px 16px; text-align: center; color: var(--text-soft); font-size: 14px; }
  /* ---------- 设置项 ---------- */
  .setting-group { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .setting-label { font-size: 13px; color: var(--text-soft); margin-bottom: 10px; }
  .seg { display: flex; background: var(--bg); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: none; background: none; color: var(--text); padding: 9px 0; border-radius: 9px; font-size: 13.5px; cursor: pointer; transition: background .2s, color .2s; }
  .seg button.on { background: var(--panel); color: var(--accent); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .theme-swatches { display: flex; gap: 12px; }
  .swatch { flex: 1; height: 46px; border-radius: 12px; border: 2px solid transparent; cursor: pointer; position: relative; overflow: hidden; }
  .swatch.on { border-color: var(--accent); }
  .swatch span { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 11px; color: #555; }
  .slider-row { display: flex; align-items: center; gap: 12px; }
  .slider-row input[type=range] { flex: 1; accent-color: var(--accent); }
  .slider-val { font-size: 13px; color: var(--text-soft); min-width: 42px; text-align: right; }
  /* ---------- 加载 / 错误态 ---------- */
  #loader, #error {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 30px;
  }
  #error { display: none; }
  .spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error p { color: var(--text-soft); font-size: 14px; max-width: 320px; line-height: 1.6; }
  .pick-btn { background: var(--accent); color: #fff; border: none; padding: 11px 22px; border-radius: 980px; font-size: 15px; cursor: pointer; }
  .pick-btn:active { opacity: .85; }
  .file-input { display: none; }
  /* 加载进度条 */
  .load-progress { width: 220px; max-width: 72%; height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 2px; }
  .load-progress-bar { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .2s linear; }
  #loadPercent { margin-top: 10px; font-size: 12px; color: var(--text-soft); font-variant-numeric: tabular-nums; }
  /* 点击翻章：改由 #reader 自身 click 监听处理（见脚本），不再使用覆盖层，
     避免移动端覆盖层拦截触摸导致阅读区无法滚动。 */
  @media (max-width: 480px) {
    :root { --font-size: 18px; }
    #content { padding-left: 18px; padding-right: 18px; }
  }
  /* ---------- 书架首页（微信读书风，全屏） ---------- */
  #home {
    position: fixed; inset: 0; z-index: 25;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #home[hidden] { display: none; }
  /* 顶部 header：左侧大字+副标题，右侧两个图标按钮 */
  .home-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 40px) 18px 12px;
    flex: 0 0 auto;
  }
  .home-head h1 { margin-top: 2px; }
  .home-head h1 {
    margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1;
  }
  .home-sub { margin-top: 4px; color: var(--text-soft); font-size: 13px; }
  .home-head-right { display: flex; gap: 6px; }
  .hbtn {
    width: 38px; height: 38px; border: none; border-radius: 50%;
    background: transparent; color: var(--text); font-size: 18px;
    display: grid; place-items: center; cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .hbtn:active { background: var(--line); transform: scale(.94); }
  /* 搜索行（默认收起） */
  .home-search-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 18px 8px; flex: 0 0 auto;
  }
  .home-search-row input {
    flex: 1; padding: 10px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    font-size: 15px; outline: none; font-family: inherit;
  }
  .home-search-row[hidden] { display: none; }
  /* 分类 chips */
  .home-filters {
    display: flex; gap: 10px; padding: 6px 18px 10px;
    overflow-x: auto; flex: 0 0 auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .home-filters::-webkit-scrollbar { display: none; }
  /* 居中并限制内容宽度（手机宽度居中，避免宽屏书卡被拉成巨型方块）*/
  .home-head, .home-search-row, .home-filters, .home-grid {
    max-width: 560px; width: 100%;
    margin-left: auto; margin-right: auto;
  }
  .chip {
    flex: 0 0 auto; padding: 7px 16px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--text);
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
    font-weight: 600;
  }
  /* 3 列书网格 */
  .home-grid {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 6px 14px calc(96px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling: touch;
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 14px 10px;
  }
  .bk {
    display: flex; flex-direction: column; cursor: pointer;
    background: transparent; border: none; padding: 0; text-align: left;
    color: var(--text); font: inherit;
  }
  .bk:active .bk-cover { transform: scale(.97); }
  .bk-cover {
    position: relative; width: 100%; aspect-ratio: 3 / 4;
    border-radius: 8px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 10px 8px 8px; color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18), inset 0 0 0 1px rgba(255,255,255,0.08);
    transition: transform .15s;
  }
  .bk-cover::after {
    /* 顶部细微高光 */
    content: ""; position: absolute; inset: 0 0 auto 0; height: 38%;
    background: linear-gradient(180deg, rgba(255,255,255,.16), transparent);
    pointer-events: none;
  }
  .bk-bigchar {
    font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
    font-size: 26px; font-weight: 700; line-height: 1.1;
    writing-mode: vertical-rl; text-orientation: upright;
    letter-spacing: 2px;
    margin-top: 6px; flex: 1; overflow: hidden;
    text-shadow: 0 1px 2px rgba(0,0,0,.18);
  }
  .bk-mininame {
    font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
    font-size: 12px; opacity: .9; letter-spacing: 1px;
    border-top: 1px solid rgba(255,255,255,.35); padding-top: 6px;
  }
  .bk-tag {
    position: absolute; top: 0; right: 0;
    background: rgba(0,0,0,.42); color: #fff;
    font-size: 10px; font-weight: 600;
    padding: 3px 6px; border-bottom-left-radius: 6px;
    backdrop-filter: blur(6px);
  }
  .bk-tag.fresh { background: linear-gradient(135deg, #ff5252, #ff1744); }
  .bk-tag.done { background: rgba(255,255,255,.82); color: #333; }
  .bk-name {
    font-size: 13px; font-weight: 600;
    line-height: 1.35; margin-top: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; min-height: 36px;
  }
  .bk-prog {
    font-size: 11px; color: var(--text-soft); margin-top: 4px;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .bk-progbar { height: 3px; background: var(--line); border-radius: 999px; margin-top: 5px; overflow: hidden; }
  .bk-progbar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  /* 空状态 */
  .home-empty {
    grid-column: 1 / -1;
    padding: 60px 24px; text-align: center; color: var(--text-soft);
    font-size: 14px; line-height: 1.7;
  }
  /* 悬浮「导入本地书」按钮 */
  .fab {
    position: fixed; right: 20px; bottom: calc(28px + env(safe-area-inset-bottom));
    width: 56px; height: 56px; border: none; border-radius: 50%;
    background: linear-gradient(135deg, #ff5f6d, #ff1744);
    color: #fff; font-size: 28px; font-weight: 300;
    display: grid; place-items: center; cursor: pointer;
    box-shadow: 0 8px 22px rgba(255,23,68,.35), 0 2px 6px rgba(0,0,0,.12);
    transition: transform .15s; z-index: 30;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .fab:active { transform: scale(.92); }
  /* 排序菜单 */
  .sort-menu {
    position: fixed; right: 14px; top: calc(env(safe-area-inset-top) + 64px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 6px 0; min-width: 140px; box-shadow: 0 8px 24px rgba(0,0,0,.12);
    z-index: 40; display: none;
  }
  .sort-menu.show { display: block; }
  .sort-menu button {
    width: 100%; padding: 10px 16px; border: none; background: transparent;
    color: var(--text); text-align: left; font-size: 14px; cursor: pointer;
    font-family: inherit;
  }
  .sort-menu button:hover { background: var(--line); }
  .sort-menu button.active { color: var(--accent); font-weight: 600; }
  @media (max-width: 360px) {
    .home-grid { grid-template-columns: repeat(3, 1fr); gap: 12px 8px; padding-left: 10px; padding-right: 10px; }
    .home-head h1 { font-size: 28px; }
  }
  /* ---------- 章末「下一章」卡片 ---------- */
  .next-chapter {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin: 2.4em 0 0.4em; padding: 16px 18px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    cursor: pointer; transition: transform .15s, background .15s; color: var(--text);
  }
  .next-chapter:active { transform: scale(.985); background: var(--line); }
  .next-chapter .nc-label { font-size: 12px; color: var(--text-soft); flex: 0 0 auto; }
  .next-chapter .nc-title { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: 4px; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .next-chapter .nc-arrow { color: var(--accent); font-size: 20px; flex: 0 0 auto; }
  .next-chapter.end { cursor: default; }
  .next-chapter.end .nc-arrow { color: var(--text-soft); font-size: 13px; font-weight: 400; }
  /* ---------- 书签与笔记 ---------- */
  .bm-btn.filled { color: var(--accent); }
  .bm-add {
    width: 100%; padding: 12px; border: 1px dashed var(--line); background: transparent;
    color: var(--accent); border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 12px;
  }
  .bm-add:active { background: var(--line); }
  .bm-item {
    display: block; width: 100%; text-align: left; border: 1px solid var(--line);
    background: none; color: var(--text); padding: 12px; border-radius: 12px; margin-bottom: 8px; cursor: pointer;
    transition: background .15s;
  }
  .bm-item:active { background: var(--line); }
  .bm-ch { font-size: 12px; color: var(--text-soft); margin-bottom: 4px; }
  .bm-snip {
    font-size: 14px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .bm-note { font-size: 13px; color: var(--accent); margin-top: 6px; line-height: 1.5; word-break: break-word; }
  .bm-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .bm-time { font-size: 11px; color: var(--text-soft); }
  .bm-actions { display: flex; gap: 4px; }
  .bm-ic { width: 30px; height: 30px; border: none; background: var(--bg); border-radius: 8px; color: var(--text-soft); font-size: 14px; cursor: pointer; display: grid; place-items: center; }
  .bm-ic:active { background: var(--line); }
  .bm-empty { padding: 40px 16px; text-align: center; color: var(--text-soft); font-size: 14px; line-height: 1.7; }
  /* 笔记弹层 */
  .bm-modal { position: fixed; inset: 0; z-index: 60; display: none; }
  .bm-modal.show { display: block; }
  .bm-sheet {
    position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel);
    border-top-left-radius: 18px; border-top-right-radius: 18px; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    box-shadow: var(--shadow);
  }
  .bm-sheet h3 { margin: 0 0 12px; font-size: 16px; }
  .bm-sheet textarea {
    width: 100%; min-height: 96px; resize: none; padding: 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 15px; outline: none;
  }
  .bm-sheet-actions { display: flex; gap: 10px; margin-top: 12px; }
  .bm-sheet-actions button { flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .bm-save { background: var(--accent); color: #fff; }
  .bm-cancel { background: var(--line); color: var(--text); }
  /* 跳转高亮 */
  @keyframes bmflash { 0% { background: color-mix(in srgb, var(--accent) 32%, transparent); } 100% { background: transparent; } }
  .bm-flash { animation: bmflash 1.6s ease; border-radius: 6px; }
  /* Toast */
  #toast {
    position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(10px);
    background: rgba(0,0,0,.82); color: #fff; font-size: 13.5px; padding: 10px 18px; border-radius: 999px;
    z-index: 70; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; max-width: 80vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body data-theme="light">

<header id="topbar" class="hidden">
  <button class="icon-btn" id="btnBack" aria-label="返回书架">‹ 书架</button>
  <button class="icon-btn" id="btnToc" aria-label="目录">☰</button>
  <button class="title-btn" id="bookTitleBtn" aria-label="返回书架">

<script>
"use strict";
(function () {
  // ============ 状态 ============
  const state = {
    bookName: "",
    bookId: "",        // 来源标识：本地路径 / 远程URL / 文件名，用于进度与续读
    chapters: [],      // { title, paragraphs: [] }
    current: 0,
    turnMode: "tap",   // tap | scroll
    autoHide: true,
  };

  const FONT_MAP = {
    serif: '"Songti SC","STSong","SimSun",Georgia,serif',
    sans: '-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif',
  };

  // ============ DOM ============
  const $ = (s) => document.querySelector(s);
  const reader = $("#reader");
  const content = $("#content");
  const loader = $("#loader");
  const loaderText = $("#loaderText");
  const loadProgressBar = $("#loadProgressBar");
  const loadPercent = $("#loadPercent");
  const errorBox = $("#error");
  const errMsg = $("#errMsg");
  const bookTitleEl = $("#bookTitle");
  const progressBar = $("#progressBar");
  const chapterPos = $("#chapterPos");

  // ============ 章节解析 ============
  // 多模式正则，统计每种模式命中的标题行数，择优采用
  const PATTERNS = [
    { key: "cn", re: /^\s*第\s*[0-9零一二三四五六七八九十百千万两]+\s*[章回卷节部篇集]/ },
    { key: "en", re: /^\s*chapter\s+[0-9]+\b/i },
    { key: "num", re: /^\s*[0-9]+[\.．、]\s*\S+/ },
  ];

  function isTitleLine(line, re) { return re.test(line); }

  function parseNovel(raw) {
    const text = (raw || "").replace(/﻿/g, "");
    const lines = text.split(/\r?\n/);
    const trimmed = lines.map((l) => l.replace(/\s+$/, ""));

    // 统计各模式
    let best = null;
    for (const p of PATTERNS) {
      let count = 0;
      for (const l of trimmed) if (isTitleLine(l, p.re)) count++;
      if (count >= 2 && (!best || count > best.count)) best = { p, count };
    }

    if (!best) {
      // 无明确章节：整本作为单章
      return [buildChapter("正文", trimmed)];
    }

    const re = best.p.re;
    const chapters = [];
    let cur = null;
    for (const l of trimmed) {
      if (isTitleLine(l, re)) {
        cur = { title: l.trim(), lines: [] };
        chapters.push(cur);
      } else if (cur) {
        cur.lines.push(l);
      }
      // 首个章节标题之前的卷首语（书名/作者等）直接忽略
    }
    return chapters.map((c) => buildChapter(c.title, c.lines));
  }

  // 异步版：每解析 5000 行让出主线程，onProgress(pct 0~100) 让 UI 显示解析进度
  async function parseNovelAsync(raw, onProgress) {
    const text = (raw || "").replace(/﻿/g, "");
    const lines = text.split(/\r?\n/);
    const total = lines.length;
    const YIELD_EVERY = 5000;
    const sleep = () => new Promise((r) => setTimeout(r, 0));
    if (onProgress) onProgress(2);

    // 第一遍：构建 trimmed 数组（顺便按需让出）
    const trimmed = new Array(total);
    for (let i = 0; i < total; i++) {
      trimmed[i] = lines[i].replace(/\s+$/, "");
      if ((i & 0x1fff) === 0 && i > 0) await sleep();
    }
    if (onProgress) onProgress(25);

    // 统计各模式命中数
    let best = null;
    for (const p of PATTERNS) {
      let count = 0;
      for (let i = 0; i < total; i++) if (isTitleLine(trimmed[i], p.re)) count++;
      if (count >= 2 && (!best || count > best.count)) best = { p, count };
    }
    if (!best) { if (onProgress) onProgress(100); return [buildChapter("正文", trimmed)]; }
    if (onProgress) onProgress(40);

    const re = best.p.re;
    const chapters = [];
    let cur = null;
    for (let i = 0; i < total; i++) {
      const l = trimmed[i];
      if (isTitleLine(l, re)) {
        cur = { title: l.trim(), lines: [] };
        chapters.push(cur);
      } else if (cur) {
        cur.lines.push(l);
      }
      if ((i % YIELD_EVERY) === 0 && i > 0) {
        if (onProgress) onProgress(40 + Math.round(i / total * 60));
        await sleep();
      }
    }
    if (onProgress) onProgress(100);
    return chapters.map((c) => buildChapter(c.title, c.lines));
  }

  function buildChapter(title, lines) {
    // 按空行切段，段内换行保留为 <br>
    const paras = [];
    let buf = [];
    const flush = () => {
      if (buf.length) {
        paras.push(buf.join("\n").replace(/\n/g, "<br>"));
        buf = [];
      }
    };
    for (const l of lines) {
      if (l.trim() === "") flush();
      else buf.push(l.replace(/</g, "&lt;").replace(/>/g, "&gt;"));
    }
    flush();
    return { title, paragraphs: paras };
  }

  // ============ 渲染 ============
  function renderChapter(idx) {
    idx = Math.max(0, Math.min(idx, state.chapters.length - 1));
    state.current = idx;
    const ch = state.chapters[idx];
    let html = '<h1 class="chapter-title">' + escapeHtml(ch.title) + "</h1>";
    if (ch.paragraphs.length === 0) {
      html += '<p class="no-indent" style="color:var(--text-soft)">（本章无内容）</p>';
    } else {
      ch.paragraphs.forEach((p, i) => {
        html += "<p" + (i === 0 ? ' class="no-indent"' : "") + ' data-pidx="' + i + '">' + p + "</p>";
      });
    }
    // 章末「下一章」卡片：始终可达，不依赖底部栏
    if (state.current < state.chapters.length - 1) {
      const nt = state.chapters[state.current + 1].title;
      html += '<div class="next-chapter" id="nextChapterCard"><span class="nc-label">下一章</span><span class="nc-title">' + escapeHtml(nt) + '</span><span class="nc-arrow">›</span></div>';
    } else {
      html += '<div class="next-chapter end"><span class="nc-label">已是最后一章</span><span class="nc-arrow">共 ' + state.chapters.length + ' 章</span></div>';
    }
    content.innerHTML = html;
    const ncc = document.getElementById("nextChapterCard");
    if (ncc) ncc.addEventListener("click", () => {
      if (state.current < state.chapters.length - 1) renderChapter(state.current + 1);
    });
    reader.scrollTop = 0;
    updateChrome();
    saveProgress();
    markActiveToc();
    refreshBmButton();
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function updateChrome() {
    const total = state.chapters.length;
    chapterPos.textContent = "第 " + (state.current + 1) + " / " + total + " 章";
    $("#prevCh").disabled = state.current === 0;
    $("#nextCh").disabled = state.current === total - 1;
    progressBar.style.width = total > 1 ? (state.current / (total - 1) * 100) + "%" : "100%";
  }

  // ============ 目录 ============
  function renderToc(filter) {
    const list = $("#tocList");
    list.innerHTML = "";
    const f = (filter || "").trim().toLowerCase();
    const items = state.chapters
      .map((c, i) => ({ c, i }))
      .filter((o) => !f || o.c.title.toLowerCase().includes(f));
    if (!items.length) {
      list.innerHTML = '<div class="toc-empty">未找到匹配章节</div>';
      return;
    }
    for (const { c, i } of items) {
      const b = document.createElement("button");
      b.className = "toc-item" + (i === state.current ? " active" : "");
      b.textContent = (i + 1) + ". " + c.title;
      b.dataset.idx = i;
      b.addEventListener("click", () => {
        renderChapter(i);
        closeDrawers();
      });
      list.appendChild(b);
    }
  }

  function markActiveToc() {
    document.querySelectorAll(".toc-item").forEach((b) => {
      b.classList.toggle("active", Number(b.dataset.idx) === state.current);
    });
  }

  // ============ 抽屉 ============
  const scrim = $("#scrim");
  function openDrawer(el) { closeDrawers(); scrim.classList.add("show"); el.classList.add("show"); }
  function closeDrawers() {
    scrim.classList.remove("show");
    $("#tocDrawer").classList.remove("show");
    $("#setDrawer").classList.remove("show");
  }
  scrim.addEventListener("click", closeDrawers);
  document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closeDrawers));
  $("#btnToc").addEventListener("click", () => { renderToc($("#tocSearch").value); openDrawer($("#tocDrawer")); });
  $("#btnBack").addEventListener("click", showHome);
  $("#bookTitleBtn").addEventListener("click", showHome);
  $("#btnSettings").addEventListener("click", () => openDrawer($("#setDrawer")));
  $("#tocSearch").addEventListener("input", (e) => renderToc(e.target.value));

  // ============ 书签与笔记 ============
  const bmDrawer = $("#bmDrawer");
  const bmList = $("#bmList");
  const bmCount = $("#bmCount");
  const bmModal = $("#bmModal");
  const bmNoteInput = $("#bmNoteInput");
  const btnBm = $("#btnBm");
  let editingBmId = null;
  let bmScrollTimer = null;

  function bmStoreKey() { return "novelReader.bm." + hashStr(state.bookId || state.bookName); }
  function loadBookmarks() {
    try { const a = JSON.parse(localStorage.getItem(bmStoreKey())); return Array.isArray(a) ? a : []; }
    catch (e) { return []; }
  }
  function saveBookmarks(arr) {
    try { localStorage.setItem(bmStoreKey(), JSON.stringify(arr)); } catch (e) {}
  }
  function bmDedupeKey(chapter, paragraph) { return chapter + ":" + paragraph; }

  // 当前阅读位置：章节 + 最接近视口顶部的段落
  function currentLocation() {
    const chapter = state.current;
    const ps = content.querySelectorAll("p[data-pidx]");
    let paragraph = 0, snippet = "";
    if (ps.length) {
      const ref = reader.getBoundingClientRect().top + 80;
      let best = 0, bestDist = Infinity;
      ps.forEach((p, i) => {
        const d = Math.abs(p.getBoundingClientRect().top - ref);
        if (d < bestDist) { bestDist = d; best = i; }
      });
      paragraph = best;
      snippet = (ps[best].textContent || "").trim().slice(0, 40);
    }
    return { chapter, paragraph, snippet, chapterTitle: state.chapters[chapter] ? state.chapters[chapter].title : "" };
  }

  function refreshBmButton() {
    if (!btnBm) return;
    const loc = currentLocation();
    const list = loadBookmarks();
    const exists = list.some((b) => bmDedupeKey(b.chapter, b.paragraph) === bmDedupeKey(loc.chapter, loc.paragraph));
    btnBm.classList.toggle("filled", exists);
  }

  function relTime(ts) {
    if (!ts) return "";
    const d = (Date.now() - ts) / 1000;
    if (d < 60) return "刚刚";
    if (d < 3600) return Math.floor(d / 60) + " 分钟前";
    if (d < 86400) return Math.floor(d / 3600) + " 小时前";
    if (d < 86400 * 30) return Math.floor(d / 86400) + " 天前";
    try { return new Date(ts).toLocaleDateString("zh-CN"); } catch (e) { return ""; }
  }

  function renderBookmarks() {
    const list = loadBookmarks().slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    bmCount.textContent = list.length ? "(" + list.length + ")" : "";
    bmList.innerHTML = "";
    const addBtn = document.createElement("button");
    addBtn.className = "bm-add";
    addBtn.textContent = "＋ 收藏当前位置";
    addBtn.addEventListener("click", addBookmarkAtCurrent);
    bmList.appendChild(addBtn);
    if (!list.length) {
      const e = document.createElement("div");
      e.className = "bm-empty";
      e.textContent = "还没有书签。点上方按钮收藏当前阅读位置，可写下笔记。";
      bmList.appendChild(e);
      return;
    }
    for (const b of list) {
      const item = document.createElement("button");
      item.className = "bm-item";
      const ch = document.createElement("div");
      ch.className = "bm-ch";
      ch.textContent = (typeof b.chapter === "number" ? "第 " + (b.chapter + 1) + " 章 · " : "") + (b.chapterTitle || "");
      const snip = document.createElement("div");
      snip.className = "bm-snip";
      snip.textContent = b.snippet || "（无正文）";
      item.appendChild(ch);
      item.appendChild(snip);
      if (b.note) {
        const note = document.createElement("div");
        note.className = "bm-note";
        note.textContent = "📝 " + b.note;
        item.appendChild(note);
      }
      const meta = document.createElement("div");
      meta.className = "bm-meta";
      const time = document.createElement("span");
      time.className = "bm-time";
      time.textContent = relTime(b.createdAt);
      const actions = document.createElement("div");
      actions.className = "bm-actions";
      const edit = document.createElement("button");
      edit.className = "bm-ic"; edit.textContent = "✎"; edit.title = "编辑笔记";
      edit.addEventListener("click", (ev) => { ev.stopPropagation(); openNoteEditor(b.id); });
      const del = document.createElement("button");
      del.className = "bm-ic"; del.textContent = "🗑"; del.title = "删除";
      del.addEventListener("click", (ev) => { ev.stopPropagation(); deleteBookmark(b.id); });
      actions.appendChild(edit); actions.appendChild(del);
      meta.appendChild(time); meta.appendChild(actions);
      item.appendChild(meta);
      item.addEventListener("click", () => gotoBookmark(b));
      bmList.appendChild(item);
    }
  }

  function addBookmarkAtCurrent() {
    const loc = currentLocation();
    let list = loadBookmarks();
    const key = bmDedupeKey(loc.chapter, loc.paragraph);
    const existing = list.find((b) => bmDedupeKey(b.chapter, b.paragraph) === key);
    if (existing) { toast("该位置已有书签"); openNoteEditor(existing.id); return; }
    const bm = {
      id: "bm" + Date.now() + "_" + Math.floor(Math.random() * 1000),
      chapter: loc.chapter, paragraph: loc.paragraph, snippet: loc.snippet,
      chapterTitle: loc.chapterTitle, note: "", createdAt: Date.now(),
    };
    list.push(bm);
    saveBookmarks(list);
    refreshBmButton();
    renderBookmarks();
    toast("已收藏当前位置");
  }

  function deleteBookmark(id) {
    const list = loadBookmarks().filter((b) => b.id !== id);
    saveBookmarks(list);
    refreshBmButton();
    renderBookmarks();
    toast("已删除书签");
  }

  function openNoteEditor(id) {
    editingBmId = id;
    const bm = loadBookmarks().find((b) => b.id === id);
    bmNoteInput.value = bm && bm.note ? bm.note : "";
    bmModal.classList.add("show");
  }
  function closeNoteEditor() { editingBmId = null; bmModal.classList.remove("show"); }
  function saveNote() {
    if (!editingBmId) return;
    const list = loadBookmarks();
    const bm = list.find((b) => b.id === editingBmId);
    if (bm) { bm.note = bmNoteInput.value.trim(); saveBookmarks(list); }
    closeNoteEditor();
    renderBookmarks();
    toast("笔记已保存");
  }

  function gotoBookmark(bm) {
    closeDrawers();
    let idx = bm.chapter;
    if (idx == null || idx < 0 || idx >= state.chapters.length) {
      const found = state.chapters.findIndex((c) => c.title === bm.chapterTitle);
      idx = found >= 0 ? found : 0;
    }
    renderChapter(idx);
    requestAnimationFrame(() => {
      const ps = content.querySelectorAll("p[data-pidx]");
      const target = ps[bm.paragraph] || ps[Math.min(bm.paragraph || 0, ps.length - 1)];
      if (target) {
        target.scrollIntoView({ block: "start" });
        target.classList.add("bm-flash");
        setTimeout(() => target.classList.remove("bm-flash"), 1700);
      }
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const t = $("#toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
  }

  btnBm.addEventListener("click", () => {
    const loc = currentLocation();
    const list = loadBookmarks();
    const exists = list.some((b) => bmDedupeKey(b.chapter, b.paragraph) === bmDedupeKey(loc.chapter, loc.paragraph));
    if (!exists) addBookmarkAtCurrent();
    renderBookmarks();
    openDrawer(bmDrawer);
  });
  $("#bmNoteCancel").addEventListener("click", closeNoteEditor);
  $("#bmNoteSave").addEventListener("click", saveNote);
  $("#bmModalScrim").addEventListener("click", closeNoteEditor);

  // ============ 翻页 / 滚动 ============
  $("#prevCh").addEventListener("click", () => renderChapter(state.current - 1));
  $("#nextCh").addEventListener("click", () => renderChapter(state.current + 1));

  // 点击翻章：直接监听 #reader 自身（覆盖层会拦截触摸导致手机无法滑动，故移除）。
  // 浏览器在滚动/拖拽后不会触发 click，因此「滑动」与「点击翻章」天然区分。
  reader.addEventListener("click", (e) => {
    if (state.turnMode !== "tap") return;
    // 卡片/链接等交互元素不触发翻章
    if (e.target.closest(".next-chapter, a, button")) return;
    const rect = reader.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const w = rect.width;
    if (x < w / 3) renderChapter(state.current - 1);
    else if (x > (2 * w) / 3) renderChapter(state.current + 1);
  });

  // 滚动进度（仅用于视觉反馈，不影响章节定位）
  reader.addEventListener("scroll", () => {
    if (state.turnMode === "scroll") {
      const max = reader.scrollHeight - reader.clientHeight;
      const ratio = max > 0 ? reader.scrollTop / max : 0;
      const total = state.chapters.length;
      progressBar.style.width = ((state.current + ratio) / total * 100) + "%";
    }
    if (state.autoHide) {
      const goingDown = reader.scrollTop > (reader._lastTop || 0);
      reader._lastTop = reader.scrollTop;
      setChromeVisible(!goingDown || reader.scrollTop < 10);
    }
    clearTimeout(bmScrollTimer);
    bmScrollTimer = setTimeout(refreshBmButton, 250);
  });

  let chromeTimer = null;
  function setChromeVisible(v) {
    // 只让顶栏跟随滚动隐藏；底栏（含上一章/下一章）始终保留，确保可翻章

  // ============ 设置持久化 ============
  const SET_KEY = "novelReader.settings";
  function loadSettings() {

  function applyTheme(t) { document.body.dataset.theme = t; const m = { light: "#f5f5f7", sepia: "#f4ecd8", dark: "#000000" }[t]; if (m) document.querySelector('meta[name=theme-color]').setAttribute("content", m); }
  function applyFont(f) { document.documentElement.style.setProperty("--font-family", FONT_MAP[f] || FONT_MAP.serif); }
  function applyFontSize(v) { document.documentElement.style.setProperty("--font-size", v + "px"); }
  function applyLineHeight(v) { document.documentElement.style.setProperty("--line-height", v); }

  $("#lineHeight").addEventListener("input", (e) => { applyLineHeight(e.target.value); $("#lineHeightVal").textContent = Number(e.target.value).toFixed(1); saveSettings(); });

  // ============ 进度记忆 ============
  function progressKey() { return "novelReader.progress." + hashStr(state.bookId || state.bookName); }
  function saveProgress() {
    try { localStorage.setItem(progressKey(), JSON.stringify({ idx: state.current, total: state.chapters.length, ts: Date.now() })); } catch (e) {}
  }
  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(progressKey())); } catch (e) { return null; }
  }
  function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) { h = (h << 5) - h + s.charCodeAt(i); h |= 0; } return String(h); }
  function rememberLastBook(id) { try { localStorage.setItem("novelReader.lastBook", id); } catch (e) {} }
  function getLastBook() { try { return localStorage.getItem("novelReader.lastBook"); } catch (e) { return null; } }
  function savedProgress(id) {
    try { const r = localStorage.getItem("novelReader.progress." + hashStr(id)); return r ? JSON.parse(r) : null; } catch (e) { return null; }
  }
  // 进度状态计算（id → { type: 'done'|'pct'|'new', pct, idx, total }）
  function progressInfo(id) {
    const p = savedProgress(id);
    if (!p || typeof p.idx !== "number") return { type: "new" };
    const total = (typeof p.total === "number" && p.total > 0) ? p.total : (p.idx + 1);
    if (p.idx >= total - 1) return { type: "done", pct: 100 };
    const pct = Math.max(1, Math.min(99, Math.round((p.idx / (total - 1)) * 100)));
    return { type: "pct", pct, idx: p.idx, total };
  }

  // ============ 文件加载 ============
  // 本地路径或远程 http(s) URL 均可；raw.githubusercontent.com / jsDelivr 等均放行 CORS
  // 设置加载进度（0~100）；下载占 0~85%，解析占 85~100%，单调上升避免数字回退
  function setLoadProgress(pct, text) {
    const p = Math.max(0, Math.min(100, pct | 0));
    if (loadProgressBar) loadProgressBar.style.width = p + "%";
    if (loadPercent) loadPercent.textContent = p + "%";
    if (text && loaderText) loaderText.textContent = text;
  }

  // onProgress(pct 0~100) 上报下载进度；基于 content-length 流式读取
  async function fetchText(src, onProgress) {
    const isRemote = /^https?:\/\//i.test(src);
    const url = isRemote ? src : (encodeURIComponent(src) + "?t=" + Date.now());
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const total = Number(res.headers.get("content-length")) || 0;
    let buf;
    if (res.body && res.body.getReader && total > 0) {
      const reader = res.body.getReader();
      const chunks = [];
      let received = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        if (onProgress) onProgress(Math.min(99, Math.round(received / total * 100)));
      }
      const all = new Uint8Array(received);
      let pos = 0;
      for (const c of chunks) { all.set(c, pos); pos += c.length; }
      buf = all;
    } else {
      // 无 content-length 或不支持流式：退化为整块读取（无进度百分比）
      buf = new Uint8Array(await res.arrayBuffer());
    }
    // 优先 UTF-8（fatal：碰到非法序列即抛错）；失败回退 GB18030（GBK 超集）
    try {
      return new TextDecoder("utf-8", { fatal: true }).decode(buf);
    } catch (e) {
      try { return new TextDecoder("gb18030").decode(buf); } catch (e2) { return new TextDecoder("utf-8").decode(buf); }
    }
  }

  async function ingest(raw, name, id) {
    state.bookName = name || "小说";
    state.bookId = id || name || "unknown";
    bookTitleEl.textContent = state.bookName;
    setLoadProgress(85, "解析章节中… 0%");
    state.chapters = await parseNovelAsync(raw, (pct) => {
      setLoadProgress(85 + Math.round(pct * 0.15), "解析章节中… " + pct + "%");
    });
    setLoadProgress(100, "准备就绪");
    loader.style.display = "none";
    errorBox.style.display = "none";
    renderToc("");
    let start = 0;
    const p = loadProgress();
    if (p && p.idx >= 0 && p.idx < state.chapters.length) start = p.idx;
    renderChapter(start);
  }

  // ============ IndexedDB 缓存（解析结果） ============
  // 下载+解析一次后存入本地，重开秒开；以 HEAD 校验 ETag / (长度+修改时间) 判定版本。
  const DB_NAME = "novelReaderDB", DB_VER = 1, DB_STORE = "books";
  let _db = null;
  function openDB() {
    return new Promise((resolve) => {
      if (_db) return resolve(_db);
      if (!("indexedDB" in window)) return resolve(null);
      let req;
      try { req = indexedDB.open(DB_NAME, DB_VER); } catch (e) { return resolve(null); }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE, { keyPath: "id" });
      };
      req.onsuccess = () => { _db = req.result; resolve(_db); };
      req.onerror = () => resolve(null);
    });
  }
  async function getCache(id) {
    try {
      const db = await openDB();
      if (!db) return null;
      return await new Promise((resolve) => {
        const tx = db.transaction(DB_STORE, "readonly");
        const r = tx.objectStore(DB_STORE).get(id);
        r.onsuccess = () => resolve(r.result || null);
        r.onerror = () => resolve(null);
      });
    } catch (e) { return null; }
  }
  async function setCache(id, data) {
    try {
      const db = await openDB();
      if (!db) return;
      await new Promise((resolve) => {
        const tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).put(Object.assign({ id }, data));
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      });
    } catch (e) { /* 缓存写入失败不影响阅读 */ }
  }

  // 取远端版本信息（HEAD）；本地文件走不带时间戳的稳定 URL，便于与缓存比对
  async function fetchHead(src) {
    const isRemote = /^https?:\/\//i.test(src);
    const url = isRemote ? src : encodeURIComponent(src);
    try {
      const res = await fetch(url, { method: "HEAD", cache: "no-store" });
      if (!res.ok) return null;
      return {
        etag: res.headers.get("etag"),
        len: res.headers.get("content-length"),
        lm: res.headers.get("last-modified"),
      };
    } catch (e) { return null; }
  }
  function versionMatches(head, cached) {
    if (!head) return false; // 拿不到版本信息则不信任缓存，重新下载
    if (head.etag && cached.etag && head.etag === cached.etag) return true;
    if (head.len && cached.len && head.len === cached.len &&
        head.lm && cached.lm && head.lm === cached.lm) return true;
    // CDN 不返回 etag/last-modified 时（如 jsDelivr），退而用内容长度判定版本。
    // 对小说 txt 足够：重新保存几乎必然改变字节数，等长异内容极罕见。
    if (head.len && cached.len && head.len === cached.len) return true;
    return false;
  }
  function applyCached(cached, src) {
    state.bookName = cached.name || src.split("/").pop().replace(/\.txt$/i, "");
    state.bookId = src;
    bookTitleEl.textContent = state.bookName;
    state.chapters = cached.chapters;
    loader.style.display = "none";
    errorBox.style.display = "none";
    renderToc("");
    let start = 0;
    const p = loadProgress();
    if (p && p.idx >= 0 && p.idx < state.chapters.length) start = p.idx;
    renderChapter(start);
  }

  async function loadBookById(src, title) {
    loader.style.display = "flex";
    errorBox.style.display = "none";
    setLoadProgress(0, "准备中…");
    try {
      // 命中缓存且版本未变 → 秒开，跳过下载与解析
      const cached = await getCache(src);
      if (cached && cached.chapters && versionMatches(await fetchHead(src), cached)) {
        applyCached(cached, src);
        return;
      }
      setLoadProgress(0, "下载中… 0%");
      const raw = await fetchText(src, (pct) => {
        setLoadProgress(Math.round(pct * 0.85), "下载中… " + pct + "%");
      });
      rememberLastBook(src);
      await ingest(raw, title || src.split("/").pop().replace(/\.txt$/i, ""), src);
      // ingest 已解析并渲染，结果缓存起来供下次秒开
      const head = await fetchHead(src);
      setCache(src, {
        name: state.bookName,
        chapters: state.chapters,
        etag: head ? head.etag : null,
        len: head ? head.len : null,
        lm: head ? head.lm : null,
        ts: Date.now(),
      });
    } catch (e) {
      showError("加载失败：" + src + "\n" + e.message);
    }
  }

  function showError(msg) {
    loader.style.display = "none";
    errorBox.style.display = "flex";
    if (msg) errMsg.textContent = msg;
  }

  // ============ 书库（books.json） ============
  let BOOKS = []; // { id, title, src }
  async function loadBookManifest() {
    try {
      const res = await fetch("books.json?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) return;
      const data = await res.json();
      if (Array.isArray(data)) {
        BOOKS = data
          .map((b) => {
            const src = b.url || b.file || b.path;
            return src ? { id: src, title: b.title || src.split("/").pop(), src } : null;
          })
          .filter(Boolean);
      }
    } catch (e) { /* 无书库则忽略 */ }
  }

  // ============ 书架首页（#home，全屏） ============
  // 书架状态
  const shelfState = { filter: "all", query: "", sort: "smart" };

  // 7 套配色板（按书名 hash 取）
  const COVERS = [
    ["#3a5cff", "#a44cff"],
    ["#ff5f6d", "#ffc371"],
    ["#11998e", "#38ef7d"],
    ["#5b247a", "#1bcedf"],
    ["#c94b4b", "#4b134f"],
    ["#f7971e", "#ffd200"],
    ["#0f2027", "#2c5364"],
  ];
  function bgOf(title) {
    let h = 0;
    for (let i = 0; i < (title || "").length; i++) { h = (h * 31 + title.charCodeAt(i)) | 0; }
    const a = COVERS[Math.abs(h) % COVERS.length];
    const b = COVERS[Math.abs(h >> 3) % COVERS.length];
    return "linear-gradient(135deg, " + a[0] + " 0%, " + a[1] + " 60%, " + b[0] + " 100%)";
  }
  function bigCharOf(title) {
    // 取首个可见字符（跳过装饰/书名号/空白）
    const t = (title || "").replace(/^[\s《「(\[]+/, "");
    return (t && t.trim().slice(0, 1)) || "📖";
  }
  function shortNameOf(title) {
    // 封面下方小字：截前 6 字符
    const t = (title || "").replace(/[\s《》「」\[\]()]/g, "");
    return t.length <= 6 ? t : (t.slice(0, 5) + "…");
  }

  function showHome() {
    document.getElementById("home").hidden = false;
    reader.style.display = "none";
    $("#topbar").classList.add("hidden");
    $("#bottombar").classList.add("hidden");
    renderHome();
    $("#homeSub").textContent = BOOKS.length + " 本书";
  }

  function showReader() {
    document.getElementById("home").hidden = true;
    reader.style.display = "";
    $("#topbar").classList.remove("hidden");
    $("#bottombar").classList.remove("hidden");
    reader.scrollTop = 0;
    document.querySelectorAll(".sort-menu").forEach((n) => n.classList.remove("show"));
  }

  function renderHome() {
    const list = $("#homeList");
    list.innerHTML = "";
    const q = (shelfState.query || "").trim().toLowerCase();
    let items = BOOKS.slice();
    if (q) items = items.filter((b) => (b.title || "").toLowerCase().includes(q));
    // 过滤
    if (shelfState.filter !== "all") {
      items = items.filter((b) => {
        const info = progressInfo(b.src);
        if (shelfState.filter === "reading") return info.type === "pct";
        if (shelfState.filter === "done") return info.type === "done";
        if (shelfState.filter === "new") return info.type === "new";
        return true;
      });
    }
    // 排序
    const last = getLastBook();
    items.sort((a, b) => {
      if (shelfState.sort === "recent") {
        return (savedProgress(b.src)?.ts || 0) - (savedProgress(a.src)?.ts || 0);
      }
      if (shelfState.sort === "name") {
        return (a.title || "").localeCompare(b.title || "", "zh-Hans-CN");
      }
      // smart: 在读 > 已读 > 新书; 同类按最近
      const rank = (b) => { const i = progressInfo(b.src); return i.type === "pct" ? 0 : i.type === "done" ? 1 : 2; };
      const ra = rank(a), rb = rank(b);
      if (ra !== rb) return ra - rb;
      return (savedProgress(b.src)?.ts || 0) - (savedProgress(a.src)?.ts || 0);
    });
    if (!items.length) {
      list.innerHTML = '<div class="home-empty">书库还是空的。<br>把 .txt 小说推到仓库，等待 Actions 自动生成 books.json，<br>或点右下角 ＋ 打开本地 TXT。</div>';
      return;
    }
    const frag = document.createDocumentFragment();
    for (const b of items) {
      const info = progressInfo(b.src);
      const card = document.createElement("button");
      card.className = "bk";
      card.type = "button";

      let tag = "";
      if (info.type === "new") tag = '<div class="bk-tag fresh">未读</div>';
      else if (info.type === "done") tag = '<div class="bk-tag done">完结</div>';

      let progHTML = "";
      if (info.type === "pct") {
        progHTML = '<div class="bk-prog"><span>已读 ' + info.pct + '%</span><span>第 ' + (info.idx + 1) + ' 章</span></div>' +
                   '<div class="bk-progbar"><i style="width:' + info.pct + '%"></i></div>';
      } else if (info.type === "done") {
        progHTML = '<div class="bk-prog"><span>已读完</span><span style="color:var(--accent)">' + (info.idx + 1) + ' 章</span></div>';
      } else {
        progHTML = '<div class="bk-prog"><span>未开始</span><span>轻点开启 ›</span></div>';
      }

      card.innerHTML =
        '<div class="bk-cover" style="background:' + bgOf(b.title) + '">' +
          tag +
          '<div class="bk-bigchar">' + escapeHtml(bigCharOf(b.title)) + '</div>' +
          '<div class="bk-mininame">' + escapeHtml(shortNameOf(b.title)) + '</div>' +
        '</div>' +
        '<div class="bk-name">' + escapeHtml(b.title || "未命名") + '</div>' +
        progHTML;
      card.addEventListener("click", () => {
        showReader();
        loadBookById(b.src, b.title);
      });
      frag.appendChild(card);
    }
    list.appendChild(frag);
    $("#homeSub").textContent = BOOKS.length + " 本书";
  }

  // 搜索：默认收起，点 🔍 展开
  $("#btnHomeSearch").addEventListener("click", () => {

  // 排序菜单（按钮 + 弹层）

  sortBtn.addEventListener("click", (e) => {

  // FAB：导入本地 txt
  $("#fabImport").addEventListener("click", () => $("#fileInput").click());

  // 文件选择 / 拖拽兜底
  function readFile(f) {
    if (!f) return;
    loader.style.display = "flex";
    errorBox.style.display = "none";
    setLoadProgress(0, "读取中… 0%");
    const r = new FileReader();
    r.onprogress = (e) => {
      if (e.lengthComputable) {
        const p = Math.round(e.loaded / e.total * 100);
        setLoadProgress(Math.round(p * 0.85), "读取中… " + p + "%");
      }
    };
    r.onload = () => { rememberLastBook(f.name); ingest(r.result, f.name.replace(/\.txt$/i, ""), f.name); };
    r.readAsText(f, "utf-8");
  }
  $("#pickBtn").addEventListener("click", () => $("#fileInput").click());
  $("#fileInput").addEventListener("change", (e) => readFile(e.target.files[0]));
  ["dragover", "drop"].forEach((ev) => {
    document.addEventListener(ev, (e) => {
      e.preventDefault();
      if (ev === "drop") readFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
    });
  });

  // 键盘快捷键（桌面）
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") renderChapter(state.current - 1);
    else if (e.key === "ArrowRight") renderChapter(state.current + 1);
    else if (e.key === "Escape" && scrim.classList.contains("show")) closeDrawers();
  });

  // ============ 启动 ============
  async function boot() {
    loadSettings();
    const params = new URLSearchParams(location.search);
    const named = params.get("book");

    // 1. ?book= 显式指定（支持本地路径或远程URL）
    if (named) {
      const title = /^https?:\/\//i.test(named) ? named.split("/").pop().replace(/\.txt$/i, "") : named.replace(/\.txt$/i, "");
      try { await loadBookById(named, title); return; } catch (e) { /* 继续 */ }
    }

    await loadBookManifest();

    // 书库为空时（无 books.json），把默认候选文件也作为书架条目（单本/无清单场景）
    if (!BOOKS.length) {
      for (const c of ["novel.txt", "book.txt", "小说.txt"]) {
        BOOKS.push({ id: c, title: c.replace(/\.txt$/i, ""), src: c });
      }
    }

    // 书库首页为固定落地页；点击某本书后再从章节记忆处续读
    showHome();
  }

  boot();
})();
</script>
</body>
</html>
